<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 C · 手机相机极速出片流 - ATELIER AI 质感修图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --studio-bg: #F7F5F0;
      --studio-sidebar: #EFECE5;
      --studio-panel: #E8E4DB;
      --studio-card: #FFFFFF;
      --studio-border: #DCD6CC;
      --studio-text: #1C1B1A;
      --studio-muted: #736E66;
      --studio-hover: #E3DFD6;
      --studio-accent: #B88A58;
      --studio-canvas-bg: #E7E3DB;
    }
    .dark {
      --studio-bg: #0E0E10;
      --studio-sidebar: #141417;
      --studio-panel: #1A1A1E;
      --studio-card: #222227;
      --studio-border: #2E2E36;
      --studio-text: #F4F4F6;
      --studio-muted: #8E8E9A;
      --studio-hover: #282830;
      --studio-accent: #E5C49F;
      --studio-canvas-bg: #121215;
    }
    body {
      background-color: var(--studio-bg);
      color: var(--studio-text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
    }
    .font-serif-title { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[var(--studio-bg)]">

  <!-- Top Switcher -->
  <div class="bg-[#1C1B1A] text-[#F7F5F0] px-3 sm:px-4 py-2 text-xs flex items-center justify-between border-b border-[#2E2E36] z-50 shrink-0">
    <div class="flex items-center gap-2">
      <span class="font-bold tracking-wider text-[#B88A58]">ATELIER 转型设计方案 C</span>
      <span class="text-zinc-500 hidden sm:inline">|</span>
      <span class="text-zinc-300 text-[11px] hidden sm:inline">手机相机极速出片流 · 界面完全隐形 · 风格转盘 · 小白3秒出片</span>
    </div>
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
      <a href="/prototypes/style1-capsule.html" class="px-2.5 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 whitespace-nowrap">方案 A · 胶囊流</a>
      <a href="/prototypes/style2-editorial.html" class="px-2.5 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 whitespace-nowrap">方案 B · 杂志分栏流</a>
      <a href="/prototypes/style3-camera.html" class="px-2.5 py-1 rounded-md text-[11px] bg-[#B88A58] text-stone-950 font-bold whitespace-nowrap">方案 C · 手机极速流</a>
      <a href="/prototypes/index.html" class="px-2 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-400 ml-1 whitespace-nowrap">总览</a>
    </div>
  </div>

  <!-- Floating Minimal Top Bar -->
  <div class="p-3 sm:p-4 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-[#1C1B1A] border border-[#B88A58]/40 flex items-center justify-center text-[#B88A58] font-bold text-xs">
        A
      </div>
      <span class="font-serif-title tracking-widest text-xs font-bold text-[var(--studio-text)]">ATELIER · 极速修图</span>
      <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#B88A58]/20 text-[#B88A58] font-mono">0门槛</span>
    </div>

    <!-- Center Quick Pill -->
    <div class="flex items-center gap-2">
      <button id="quickCompareBtn" class="px-3 py-1.5 rounded-xl border border-[var(--studio-border)] bg-[var(--studio-card)] text-xs font-medium text-[var(--studio-text)] hover:bg-[var(--studio-hover)] shadow-xs flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer">
        <span>🌓</span>
        <span>长按对比原图</span>
      </button>

      <button onclick="toggleTheme()" class="p-2 rounded-xl border border-[var(--studio-border)] bg-[var(--studio-card)] hover:bg-[var(--studio-hover)] text-xs text-[var(--studio-muted)]">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <!-- Pure Immersive Central Viewport (Photo Dominates 85% of View) -->
  <main class="flex-1 relative flex items-center justify-center p-3 sm:p-6 overflow-hidden">
    
    <div class="relative w-full max-w-lg h-full max-h-[68vh] flex items-center justify-center">
      
      <!-- Photo Card with Split Slider -->
      <div id="imageStage" class="relative w-[400px] h-[540px] max-h-[66vh] max-w-[88vw] bg-[var(--studio-card)] rounded-2xl border border-[var(--studio-border)] shadow-2xl overflow-hidden select-none">
        
        <!-- After Image -->
        <img id="afterImg" src="/covers/02_fantasy_qiqiguaiguai.webp" class="absolute inset-0 w-full h-full object-cover">
        
        <!-- Chic Minimal Watermark -->
        <div class="absolute top-4 right-4 px-2 py-0.5 rounded bg-black/75 text-white text-[9.5px] font-mono">
          ATELIER 2026
        </div>

        <!-- Before Image in Split Clip -->
        <div id="beforeContainer" class="absolute inset-0 overflow-hidden pointer-events-none" style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);">
          <img id="beforeImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute top-4 left-4 px-2 py-0.5 rounded bg-black/80 text-white text-[9.5px] font-mono">原图</div>
        </div>

        <!-- Split Divider -->
        <div id="sliderLine" class="absolute top-0 bottom-0 w-[2px] bg-white cursor-ew-resize z-20 pointer-events-auto" style="left: 50%;">
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-7 h-7 rounded-full bg-white text-stone-900 border border-stone-300 flex items-center justify-center text-[9px] font-bold shadow-xl">
            ↔
          </div>
        </div>

        <!-- Selected Style Floating Tag (Bottom Center of Photo) -->
        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-black/85 text-white text-[11px] font-medium flex items-center gap-1.5 shadow-lg border border-white/20 whitespace-nowrap pointer-events-none">
          <span class="w-1.5 h-1.5 rounded-full bg-[#B88A58]"></span>
          <span id="floatingStyleName">02 奇奇怪怪日杂插画</span>
        </div>

      </div>

    </div>

  </main>

  <!-- Bottom Floating Island Dock (Camera Dial & 3 Core Actions) -->
  <footer class="p-3 sm:p-5 z-30 shrink-0">
    <div class="max-w-xl mx-auto space-y-3">
      
      <!-- Camera Dial: Horizontal Circular Style Pills -->
      <div class="bg-[var(--studio-card)] border border-[var(--studio-border)] rounded-2xl p-2 shadow-xl">
        <div class="flex items-center justify-between px-2 mb-1">
          <span class="text-[10px] font-mono text-[var(--studio-muted)] uppercase tracking-wider">选择质感风格</span>
          <span class="text-[10px] text-[#B88A58] font-bold">左右滑动快速出片</span>
        </div>
        
        <div id="cameraDialTrack" class="flex items-center gap-3 overflow-x-auto no-scrollbar py-1 px-2 scroll-smooth">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- 3 Primary Action Buttons (Upload, Re-render, Downstream Handoff) -->
      <div class="grid grid-cols-3 gap-2">
        
        <!-- Button 1: Upload Photo -->
        <label class="py-3 px-2 rounded-xl bg-[var(--studio-card)] border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer shadow-xs transition-transform active:scale-95">
          <span>📷</span>
          <span>换张照片</span>
          <input type="file" id="uploadInput" accept="image/*" class="hidden">
        </label>

        <!-- Button 2: Big Golden AI Re-Render (Primary Action) -->
        <button onclick="triggerFastRender()" class="py-3 px-2 rounded-xl bg-[#B88A58] hover:bg-[#9E7345] text-stone-950 font-bold text-xs flex items-center justify-center gap-1.5 shadow-md transition-transform active:scale-95 cursor-pointer">
          <span>✨</span>
          <span>极速出片</span>
        </button>

        <!-- Button 3: Downstream Handoff (Collage / Album) -->
        <div class="relative">
          <button onclick="toggleDownstreamMenu()" id="downstreamBtn" class="w-full py-3 px-2 rounded-xl bg-[var(--studio-card)] border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] text-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs transition-transform active:scale-95 cursor-pointer">
            <span>🪄</span>
            <span>拼图 / 相册 ▾</span>
          </button>

          <!-- Popover Menu for Downstream Options -->
          <div id="downstreamMenu" class="hidden absolute bottom-full mb-2 right-0 w-56 bg-[var(--studio-card)] border border-[var(--studio-border)] rounded-xl shadow-2xl p-2 space-y-1.5 z-50 text-xs">
            <button onclick="alert('【拼图排版】：已将精修照片自动灌入 3 款高定拼图排版，进入画布调整！')" class="w-full p-2 rounded-lg hover:bg-[var(--studio-hover)] text-left flex items-center justify-between">
              <div>
                <p class="font-bold">🎨 生成拼图海报</p>
                <p class="text-[10px] text-[var(--studio-muted)]">用好图作为基础排版</p>
              </div>
              <span class="text-[#B88A58]">➔</span>
            </button>
            <div class="h-[1px] bg-[var(--studio-border)]"></div>
            <button onclick="alert('【实体画册】：已将这张照片装订进《九寨秘境》对开页，去翻阅 3D 实体书！')" class="w-full p-2 rounded-lg hover:bg-[var(--studio-hover)] text-left flex items-center justify-between">
              <div>
                <p class="font-bold">📖 收入 3D 画册</p>
                <p class="text-[10px] text-[var(--studio-muted)]">装订成实体书翻阅</p>
              </div>
              <span class="text-[#B88A58]">➔</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </footer>

  <script>
    const STYLES = [
      { id: "fantasy", name: "02 奇奇怪怪日杂插画", tag: "日杂", cover: "/covers/02_fantasy_qiqiguaiguai.webp" },
      { id: "dreamy", name: "01 梦幻动态电影海报", tag: "电影", cover: "/covers/01_dreamy_motion_editorial.webp" },
      { id: "black_ink", name: "03 黑白实景水墨二分", tag: "墨韵", cover: "/covers/03_street_photo_black_ink.webp" },
      { id: "color_chibi", name: "04 彩色轻Q实景插画", tag: "动漫", cover: "/covers/04_street_photo_color_chibi.webp" },
      { id: "culture", name: "05 文化碎片质感海报", tag: "留白", cover: "/covers/05_culture_fragment_poster.webp" },
      { id: "eastern_scenery", name: "06 东方水墨山水诗意", tag: "山水", cover: "/covers/06_eastern_ink_diptych_scenery.webp" },
      { id: "ugly", name: "11 搞怪丑萌涂鸦插画", tag: "涂鸦", cover: "/covers/11_funny_ugly_doodle.webp" }
    ];

    let currentDialIdx = 0;
    const dialTrack = document.getElementById('cameraDialTrack');

    function renderDial() {
      dialTrack.innerHTML = '';
      STYLES.forEach((s, idx) => {
        const isSel = idx === currentDialIdx;
        const btn = document.createElement('button');
        btn.className = `flex flex-col items-center shrink-0 cursor-pointer p-1 rounded-xl transition-all ${
          isSel 
            ? 'scale-105 ring-2 ring-[#B88A58] bg-[#B88A58]/10' 
            : 'opacity-70 hover:opacity-100'
        }`;
        btn.innerHTML = `
          <div class="w-14 h-14 rounded-full overflow-hidden bg-black/10 border-2 ${isSel ? 'border-[#B88A58]' : 'border-transparent'}">
            <img src="${s.cover}" class="w-full h-full object-cover">
          </div>
          <span class="text-[10px] font-medium mt-1 truncate max-w-[64px] text-center">${s.tag}</span>
        `;
        btn.onclick = () => selectDial(idx);
        dialTrack.appendChild(btn);
      });
    }

    function selectDial(idx) {
      currentDialIdx = idx;
      const s = STYLES[idx];
      document.getElementById('afterImg').src = s.cover;
      document.getElementById('floatingStyleName').textContent = s.name;
      renderDial();
    }

    // Split Slider Drag
    const imageStage = document.getElementById('imageStage');
    const beforeContainer = document.getElementById('beforeContainer');
    const sliderLine = document.getElementById('sliderLine');
    let isDragging = false;

    function updateSplit(pct) {
      pct = Math.max(0, Math.min(100, pct));
      sliderLine.style.left = `${pct}%`;
      beforeContainer.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const rect = imageStage.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const pct = (x / rect.width) * 100;
      updateSplit(pct);
    }

    sliderLine.addEventListener('pointerdown', () => {
      isDragging = true;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', () => {
        isDragging = false;
        document.removeEventListener('pointermove', onPointerMove);
      }, { once: true });
    });

    // Hold compare button
    const compBtn = document.getElementById('quickCompareBtn');
    compBtn.addEventListener('mousedown', () => updateSplit(100));
    compBtn.addEventListener('mouseup', () => updateSplit(50));
    compBtn.addEventListener('touchstart', (e) => { e.preventDefault(); updateSplit(100); });
    compBtn.addEventListener('touchend', () => updateSplit(50));

    // Upload
    document.getElementById('uploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const u = URL.createObjectURL(file);
        document.getElementById('beforeImg').src = u;
        alert('照片载入成功！划动中间滑块对比质感效果。');
      }
    });

    function toggleDownstreamMenu() {
      const m = document.getElementById('downstreamMenu');
      m.classList.toggle('hidden');
    }

    function triggerFastRender() {
      const tag = document.getElementById('floatingStyleName');
      const old = tag.textContent;
      tag.textContent = '✨ 极速 AI 重构中...';
      setTimeout(() => {
        tag.textContent = old;
        alert('质感重构完成！色彩与光影细节已自然优化。');
      }, 700);
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    renderDial();
  </script>
</body>
</html>
