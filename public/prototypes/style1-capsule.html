<body class="h-screen w-screen flex flex-col overflow-hidden">

  <!-- Top Prototype Switcher Banner -->

    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">

      <a href="/prototypes/style2-editorial.html" class="px-2.5 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 whitespace-nowrap">方案 B · 杂志分栏流</a>
      <a href="/prototypes/style3-camera.html" class="px-2.5 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 whitespace-nowrap">方案 C · 手机极速流</a>
      <a href="/prototypes/index.html" class="px-2 py-1 rounded-md text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-400 ml-1 whitespace-nowrap">总览</a>
    </div>
  </div>

  <!-- Main App Header -->
  <header class="h-14 border-b border-[var(--studio-border)] bg-[var(--studio-card)] px-4 flex items-center justify-between z-30 shrink-0">
    <!-- Left: Brand & Mode Segment -->
    <div class="flex items-center gap-3 sm:gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-[#1C1B1A] border border-[#B88A58]/40 flex items-center justify-center text-[#B88A58] font-bold text-sm">
          A
        </div>
        <span class="font-serif-title tracking-widest text-sm font-bold hidden xs:inline">ATELIER 艺境</span>
      </div>

      <!-- Core Mode Pill (AI Retouch is Primary, Collage & Album as Auxiliary) -->
      <div class="flex items-center p-0.5 rounded-lg bg-[var(--studio-panel)] border border-[var(--studio-border)] text-xs">
        <button class="px-2.5 py-1 rounded-md bg-[var(--studio-card)] text-[#B88A58] font-bold shadow-xs flex items-center gap-1">

        <svg class="w-3.5 h-3.5 text-[#B88A58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
        <span class="hidden md:inline">去拼图海报</span>

      <button onclick="triggerDownstreamAlbum()" class="px-3 py-1.5 rounded-lg bg-[var(--studio-panel)] hover:bg-[var(--studio-hover)] text-xs border border-[var(--studio-border)] font-medium flex items-center gap-1 text-[var(--studio-text)] transition-colors" title="将修好的大片装订进 3D 实体画册">
        <svg class="w-3.5 h-3.5 text-[#B88A58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <span class="hidden md:inline">收录进相册</span>

      <button onclick="saveHighRes()" class="px-3.5 py-1.5 rounded-lg bg-[#B88A58] hover:bg-[#9E7345] text-stone-950 font-bold text-xs flex items-center gap-1 shadow-xs transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

      <!-- Theme Mode Toggle -->

  <!-- Central Canvas & Stage Area -->

    <!-- Central Art Canvas Stage (White Background, Solid, Clean 12px Radius) -->
    <div class="relative w-full max-w-4xl h-full max-h-[72vh] flex items-center justify-center">
      
      <!-- Photo Container with Before/After Split Interaction -->
      <div id="imageStage" class="relative w-[440px] h-[580px] max-h-[72vh] max-w-[85vw] bg-[var(--studio-card)] rounded-xl border border-[var(--studio-border)] shadow-2xl overflow-hidden select-none">
        
        <!-- After Image (AI Stylized Output) -->
        <img id="afterImg" src="/covers/01_dreamy_motion_editorial.webp" alt="AI Stylized" class="absolute inset-0 w-full h-full object-cover">
        
        <!-- Typography Overlay on Stylized Photo (Editable/Toggleable) -->
        <div id="typographyOverlay" class="absolute inset-x-6 top-8 pointer-events-none transition-opacity duration-300">
          <p class="font-display text-white/90 text-2xl sm:text-3xl tracking-wide drop-shadow-md">Quiet Journeys</p>
          <p class="font-serif-title text-white/80 text-xs sm:text-sm tracking-widest uppercase mt-0.5 drop-shadow">ATELIER EDITORIAL • 2026</p>
        </div>
        <div id="typographyCaption" class="absolute inset-x-6 bottom-8 pointer-events-none transition-opacity duration-300">
          <p class="font-serif-title text-white/80 text-[11px] sm:text-xs leading-relaxed max-w-xs drop-shadow">
            "Moments gathered along quiet roads, soft light, and places that feel like a pause worth keeping."
          </p>
        </div>

        <!-- Before Image (Original User Photo) in Split Clip-Path -->
        <div id="beforeContainer" class="absolute inset-0 overflow-hidden pointer-events-none" style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);">
          <img id="beforeImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80" alt="Original Photo" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute top-4 left-4 px-2 py-0.5 rounded bg-black/80 text-white text-[10px] font-mono tracking-wider">
            ORIGINAL 原图
          </div>
        </div>

        <!-- Split Slider Divider Line -->
        <div id="sliderLine" class="absolute top-0 bottom-0 w-[2px] bg-white cursor-ew-resize z-20 pointer-events-auto" style="left: 50%;">
          <div class="slider-handle absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-white border border-stone-300 text-stone-800 flex items-center justify-center text-[10px] font-bold shadow-xl">
            ↔
          </div>
        </div>

        <!-- Status & Style Badge -->
        <div class="absolute top-4 right-4 px-2.5 py-1 rounded-lg bg-black/80 text-white text-xs font-mono flex items-center gap-1.5 z-10 pointer-events-none">
          <span class="w-2 h-2 rounded-full bg-[#B88A58] animate-pulse"></span>
          <span id="currentStyleLabel">01 梦幻动态电影</span>
        </div>

        <!-- Hold to View Original Button (Mobile / Fast Check) -->
        <button id="holdOriginalBtn" class="absolute bottom-4 left-4 z-20 px-3 py-1.5 rounded-lg bg-black/80 hover:bg-black text-white text-xs font-medium flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-[#B88A58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          <span>按住看原图</span>
        </button>
      </div>

      <!-- Floating Drawer Toggle Button (Top Right of Canvas) -->
      <button onclick="toggleDrawer()" class="absolute -top-3 right-0 sm:right-4 z-30 px-3 py-1.5 rounded-xl bg-[var(--studio-card)] border border-[var(--studio-border)] shadow-xl text-xs font-semibold text-[var(--studio-text)] hover:bg-[var(--studio-hover)] flex items-center gap-1.5 cursor-pointer transition-all">
        <svg class="w-3.5 h-3.5 text-[#B88A58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        <span>画面轻微调</span>
      </button>

    </div>

    <!-- Collapsible Right Drawer for Minimal Adjustments (No backdrop blur, solid white 12px) -->
    <div id="adjustDrawer" class="absolute top-4 right-4 bottom-4 w-72 bg-[var(--studio-card)] border border-[var(--studio-border)] rounded-xl shadow-2xl z-40 p-4 flex flex-col justify-between transition-transform duration-300 translate-x-[115%]">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-[var(--studio-border)]">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#B88A58]"></span>
            <h3 class="text-xs font-bold tracking-wider">画面轻微调</h3>
          </div>
          <button onclick="toggleDrawer()" class="p-1 rounded-lg hover:bg-[var(--studio-hover)] text-zinc-500">✕</button>
        </div>

        <div class="mt-4 space-y-4 text-xs">
          <!-- Text Decoration Switch -->
          <div class="space-y-1.5">
            <label class="text-[var(--studio-muted)] font-medium">杂志美学文字装饰</label>
            <div class="flex items-center gap-2">
              <button onclick="toggleText(true)" id="btnTextOn" class="flex-1 py-1.5 rounded-lg border border-[#B88A58] bg-[#B88A58]/15 text-[#B88A58] font-bold">开启排版</button>
              <button onclick="toggleText(false)" id="btnTextOff" class="flex-1 py-1.5 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]">纯净无字</button>
            </div>
          </div>

          <!-- Aspect Ratio Switch -->
          <div class="space-y-1.5">
            <label class="text-[var(--studio-muted)] font-medium">出片构图画幅</label>
            <div class="grid grid-cols-4 gap-1 text-[11px] font-mono">
              <button class="py-1 rounded-lg border border-[#B88A58] bg-[#B88A58]/15 text-[#B88A58] font-bold">3:4</button>
              <button class="py-1 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]">1:1</button>
              <button class="py-1 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]">9:16</button>
              <button class="py-1 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]">自适应</button>
            </div>
          </div>

          <!-- Mood / Vibe Keyword -->
          <div class="space-y-1.5">
            <label class="text-[var(--studio-muted)] font-medium">微调氛围意境 (可选)</label>
            <input type="text" placeholder="例：暖阳漫射、微雨松弛..." class="w-full px-2.5 py-1.5 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-xs text-[var(--studio-text)] focus:outline-none focus:border-[#B88A58]">
          </div>

          <!-- Downstream Shortcuts in Drawer -->
          <div class="pt-3 border-t border-[var(--studio-border)] space-y-2">
            <label class="text-[var(--studio-muted)] font-medium">下游一键流转</label>
            <button onclick="triggerDownstreamCollage()" class="w-full py-2 rounded-lg border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] flex items-center justify-between px-3 text-left">
              <span>🎨 送往拼图画布排版</span>
              <span class="text-[10px] text-[#B88A58]">47款模板 ➔</span>
            </button>
            <button onclick="triggerDownstreamAlbum()" class="w-full py-2 rounded-lg border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] flex items-center justify-between px-3 text-left">
              <span>📖 收录进 3D 实体相册</span>
              <span class="text-[10px] text-[#B88A58]">装订成书 ➔</span>
            </button>
          </div>
        </div>
      </div>

      <button onclick="applyAdjustments()" class="w-full py-2 rounded-lg bg-[#B88A58] text-stone-950 font-bold text-xs">
        确认应用
      </button>
    </div>

  </main>

  <!-- Bottom Horizontal Style Carousel (The Camera-Filter Core Experience) -->
  <footer class="border-t border-[var(--studio-border)] bg-[var(--studio-card)] p-2 sm:p-3 shrink-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center gap-3">
      
      <!-- Left Arrow -->
      <button onclick="scrollStyles(-1)" class="p-2 rounded-lg border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] text-xs shrink-0 hidden sm:block">
        ◀
      </button>

      <!-- Horizontal Scroll Track -->
      <div id="stylesTrack" class="flex-1 flex items-center gap-2.5 overflow-x-auto no-scrollbar scroll-smooth py-1 px-1">
        <!-- Rendered by JS -->
      </div>

      <!-- Right Arrow -->
      <button onclick="scrollStyles(1)" class="p-2 rounded-lg border border-[var(--studio-border)] hover:bg-[var(--studio-hover)] text-xs shrink-0 hidden sm:block">
        ▶
      </button>

      <!-- One-Click Fast Re-Render Button -->
      <button onclick="reRenderAi()" class="shrink-0 px-4 py-3 rounded-xl bg-[#B88A58] hover:bg-[#9E7345] text-stone-950 font-bold text-xs flex items-center gap-2 shadow-lg transition-transform active:scale-95 cursor-pointer">
        <svg class="w-4 h-4 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
        <span class="hidden sm:inline">一键 AI 质感重构</span>
        <span class="sm:hidden">生成</span>
      </button>

    </div>
  </footer>

  <script>
    const STYLES = [
      { id: "dreamy", name: "01 梦幻动态电影", tag: "电影光影", cover: "/covers/01_dreamy_motion_editorial.webp", caption: "Moments gathered along quiet roads, soft light, and places that feel like a pause worth keeping." },
      { id: "fantasy", name: "02 奇奇怪怪日杂", tag: "爆款社交", cover: "/covers/02_fantasy_qiqiguaiguai.webp", caption: "LIFE IN FRAGMENTS • NO OVERTHINKING • JUST GOOD VIBES" },
      { id: "black_ink", name: "03 黑白实景墨韵", tag: "黑白二分", cover: "/covers/03_street_photo_black_ink.webp", caption: "REALITY RESTAGED • INK & SILENCE • ARCHIVE 2026" },
      { id: "color_chibi", name: "04 彩色轻Q插画", tag: "清新动漫", cover: "/covers/04_street_photo_color_chibi.webp", caption: "Sunlit afternoon walks, gentle breeze, and colors that warm the heart." },
      { id: "culture", name: "05 文化碎片海报", tag: "梵想美学", cover: "/covers/05_culture_fragment_poster.webp", caption: "人生是旷野 • 不被定义的故事与沉静远方" },
      { id: "eastern_scenery", name: "06 东方水墨二分画", tag: "东方古韵", cover: "/covers/06_eastern_ink_diptych_scenery.webp", caption: "山川从不语，却道尽万千深意 • 东方意境手札" },
      { id: "eastern_arch", name: "07 东方水墨建筑", tag: "建筑诗意", cover: "/covers/07_eastern_ink_diptych_arch.webp", caption: "朱檐青黛，时光的沉静轮廓 • 墨韵建筑" },
      { id: "reality", name: "08 纪实重构舞台", tag: "电影舞台", cover: "/covers/08_reality_restaged.webp", caption: "STAGED REALITY • CINEMATIC SCENES" },
      { id: "ugly", name: "11 搞怪丑萌涂鸦", tag: "解压涂鸦", cover: "/covers/11_funny_ugly_doodle.webp", caption: "DON'T PANIC • BEAUTIFULLY CHAOTIC" }
    ];

    let currentStyleIndex = 0;
    const track = document.getElementById('stylesTrack');

    // Render Bottom Style Carousel
    function renderStyles() {
      track.innerHTML = '';
      STYLES.forEach((style, idx) => {
        const isSelected = idx === currentStyleIndex;
        const btn = document.createElement('button');
        btn.className = `flex flex-col items-center p-1.5 rounded-xl border text-left transition-all shrink-0 cursor-pointer ${
          isSelected 
            ? 'bg-[var(--studio-card)] border-[#B88A58] ring-2 ring-[#B88A58]/30 shadow-md scale-[1.02]' 
            : 'bg-[var(--studio-panel)] border-[var(--studio-border)] hover:border-stone-400 opacity-80 hover:opacity-100'
        }`;
        btn.style.width = '108px';
        btn.innerHTML = `
          <div class="w-full h-16 rounded-lg overflow-hidden bg-black/10 relative">
            <img src="${style.cover}" alt="${style.name}" class="w-full h-full object-cover">
            <span class="absolute bottom-1 right-1 text-[8.5px] px-1 py-0.2 rounded bg-black/80 text-[#B88A58] font-mono">${style.tag}</span>
          </div>
          <span class="text-[11px] font-semibold text-[var(--studio-text)] truncate w-full mt-1.5 text-center">${style.name}</span>
        `;
        btn.onclick = () => selectStyle(idx);
        track.appendChild(btn);
      });
    }

    function selectStyle(idx) {
      currentStyleIndex = idx;
      const s = STYLES[idx];
      document.getElementById('afterImg').src = s.cover;
      document.getElementById('currentStyleLabel').textContent = s.name;
      document.getElementById('typographyCaption').querySelector('p').textContent = `"${s.caption}"`;
      renderStyles();
    }

    function scrollStyles(dir) {
      track.scrollBy({ left: dir * 260, behavior: 'smooth' });
    }

    // Split Slider Drag Implementation
    const imageStage = document.getElementById('imageStage');
    const beforeContainer = document.getElementById('beforeContainer');
    const sliderLine = document.getElementById('sliderLine');
    let isDragging = false;

    function updateSplit(pct) {
      pct = Math.max(0, Math.min(100, pct));
      sliderLine.style.left = `${pct}%`;
      beforeContainer.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const rect = imageStage.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const pct = (x / rect.width) * 100;
      updateSplit(pct);
    }

    function startDrag(e) {
      isDragging = true;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', stopDrag);
    }

    function stopDrag() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', stopDrag);
    }

    sliderLine.addEventListener('pointerdown', startDrag);

    // Hold Original Button
    const holdBtn = document.getElementById('holdOriginalBtn');
    holdBtn.addEventListener('mousedown', () => updateSplit(100));
    holdBtn.addEventListener('mouseup', () => updateSplit(50));
    holdBtn.addEventListener('touchstart', (e) => { e.preventDefault(); updateSplit(100); });
    holdBtn.addEventListener('touchend', () => updateSplit(50));

    // Upload Photo
    document.getElementById('uploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('beforeImg').src = url;
        alert('照片上传成功！已放入原图层，可左右拖动划开对比效果。');
      }
    });

    // Right Drawer Toggle
    let drawerOpen = false;
    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      const d = document.getElementById('adjustDrawer');
      d.style.transform = drawerOpen ? 'translateX(0)' : 'translateX(115%)';
    }

    function toggleText(enable) {
      const typo1 = document.getElementById('typographyOverlay');
      const typo2 = document.getElementById('typographyCaption');
      typo1.style.opacity = enable ? '1' : '0';
      typo2.style.opacity = enable ? '1' : '0';
      document.getElementById('btnTextOn').className = enable 
        ? 'flex-1 py-1.5 rounded-lg border border-[#B88A58] bg-[#B88A58]/15 text-[#B88A58] font-bold'
        : 'flex-1 py-1.5 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]';
      document.getElementById('btnTextOff').className = !enable 
        ? 'flex-1 py-1.5 rounded-lg border border-[#B88A58] bg-[#B88A58]/15 text-[#B88A58] font-bold'
        : 'flex-1 py-1.5 rounded-lg border border-[var(--studio-border)] bg-[var(--studio-panel)] text-[var(--studio-muted)]';
    }

    function applyAdjustments() {
      toggleDrawer();
    }

    function triggerDownstreamCollage() {
      alert('【下游流转】：已将这张 AI 重构照片打包注入到「灵感拼图」画布，正在为您自动匹配 3 款多图艺术排版！');
    }

    function triggerDownstreamAlbum() {
      alert('【下游流转】：已将这张照片装订入「艺术画册 · 九寨秘境」，作为对开页 P.3-4 典藏页！');
    }

    function saveHighRes() {
      alert('【高清出片】：正在导出 2400×3200 极清海报 JPG 文件...');
    }

    function reRenderAi() {
      const badge = document.getElementById('currentStyleLabel');
      const old = badge.textContent;
      badge.textContent = '✨ 正在极速质感重构中...';
      setTimeout(() => {
        badge.textContent = old;
        alert('AI 重构出片完毕！已保留主体细节与质感光影。');
      }, 900);
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    renderStyles();
  </script>
</body>
</html>
